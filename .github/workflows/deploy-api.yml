name: Deploy API to ECR/ECS

on:
  push:
    branches: [main, master]
    paths:
      - 'api/**'
      - 'services/**'
      - 'llm/**'
      - 'eval/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'config.py'
      - 'dynamodb_store.py'
      - 's3_store.py'
      - 'paths.py'
      - 'models.py'
      - 'fit_status.py'
      - 'job_status.py'
      - 'analysis_status.py'
      - 'job_id.py'
      - 'job_title_filters.py'
      - '.dockerignore'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: careerpilot-api
  ECS_CLUSTER: careerpilot-ai
  ECS_SERVICE: careerpilot-ai-ecs-service

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"
          docker build -t "${IMAGE_URI}:${IMAGE_TAG}" -t "${IMAGE_URI}:latest" .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "IMAGE_URI=${IMAGE_URI}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment
